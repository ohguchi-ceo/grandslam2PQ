function randomComment(passed){const r=Math.random();if(r<0.02){const list=passed?POS_MOTHER:MOTHER;return {coach:'母より',text:list[Math.floor(Math.random()*list.length)]};}if(r<0.62){const list=(passed?POSITIVE:COMMENTS)['K監督'];return {coach:'K監督',text:list[Math.floor(Math.random()*list.length)]};}const coach=COACHES.filter(x=>x!=='K監督')[Math.floor(Math.random()*5)];const list=(passed?POSITIVE:COMMENTS)[coach];return {coach,text:list[Math.floor(Math.random()*list.length)]};}

let pool=[],questions=[],idx=0,score=0,outs=0,answered=false,mode='all',timer=null,timeLeft=10;
const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function setMode(m){mode=m;document.querySelectorAll('.mode button').forEach(b=>b.classList.remove('active'));$(m==='all'?'all':m).classList.add('active');start()}
document.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>setMode(b.id));
function updateOuts(){const box=document.querySelector('.outs');box.innerHTML='OUT '+[0,1,2].map(i=>'<span class="outdot '+(i<outs?'on':'')+'"></span>').join('')}
function start(){clearInterval(timer);pool=mode==='all'?DATA:DATA.filter(x=>({noun:'名詞',verb:'動詞',adj:'形容詞',adv:'副詞',conj:'接続詞'}[mode]===x.cat));questions=shuffle(pool).slice(0,10);idx=0;score=0;outs=0;$('quiz').classList.remove('hidden');$('result').classList.add('hidden');updateOuts();render()}
function render(){clearInterval(timer);answered=false;$('next').classList.remove('show');$('score').textContent=score+' / 10';$('qno').textContent='第 '+(idx+1)+' 問';$('inning').textContent=(idx+1)+'回表';const q=questions[idx];$('category').textContent=q.cat;$('word').textContent=q.word;let distract=shuffle(pool.filter(x=>x.word!==q.word)).slice(0,3).map(x=>x.meaning);let opts=shuffle([q.meaning,...distract]);$('options').innerHTML='';opts.forEach(text=>{let b=document.createElement('button');b.className='opt';b.textContent=text;b.onclick=()=>answer(b,text,q.meaning);$('options').appendChild(b)});startTimer()}
function startTimer(){timeLeft=10;updateClock();timer=setInterval(()=>{timeLeft--;updateClock();if(timeLeft<=0){clearInterval(timer);timeoutAnswer()}},1000)}
function updateClock(){$('clock').textContent=timeLeft;$('clock').classList.toggle('warn',timeLeft<=5&&timeLeft>2);$('clock').classList.toggle('danger',timeLeft<=2)}
function lock(){clearInterval(timer);document.querySelectorAll('.opt').forEach(b=>b.disabled=true)}
function showHit(){const h=$('hitFlash');h.classList.remove('show');void h.offsetWidth;h.classList.add('show');setTimeout(()=>h.classList.remove('show'),2000)}
function answer(btn,text,correct){if(answered)return;answered=true;lock();if(text===correct){score++;showHit();btn.classList.add('correct');sound(true);showNext()}else{btn.classList.add('wrong');document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});sound(false);recordOut();}}
function timeoutAnswer(){if(answered)return;answered=true;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);sound(false);recordOut()}
function recordOut(){outs++;updateOuts();if(outs>=3){setTimeout(finish,450)}else{showNext()}}
function showNext(){$('score').textContent=score+' / 10';if(outs>=3)return;setTimeout(()=>{if(idx===9)finish();else{idx++;render()}},1000)}
$('next').style.display='none';
function finish(){clearInterval(timer);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=score+' / '+(idx+1);const passed=score>=7;const badge=$('resultBadge');badge.textContent=passed?'合格':'不合格';badge.className='resultBadge '+(passed?'pass':'fail');const c=randomComment(passed);$('managerComment').textContent=c.coach+'より「'+c.text+'」';$('coachComment').textContent='';$('resultText').textContent=passed?'7問以上正解！3アウトになる前にしっかり結果を出した！':'今回は不合格。もう一度練習して、次は合格を狙おう！'}
$('restart').onclick=start;
function sound(ok){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();if(ok){[880,1175].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.22,c.currentTime+i*.09+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.09+.22);o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.09);o.stop(c.currentTime+i*.09+.25)})}else{let o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(180,c.currentTime);o.frequency.exponentialRampToValueAtTime(90,c.currentTime+.3);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.32);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.34)}}start();</script></body></html>
